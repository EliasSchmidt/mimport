# mimport als abgeschlossener Dienst.
#
# Nach außen führen nur zwei Dinge: der Port für die Weboberfläche und das
# Musikverzeichnis, in dem das fertige Ergebnis landet.
#
# Für diesen Stand läuft bewusst **nur ein einziger Dienst**: der bisherige
# ``mimport-cd``. Er ist im Heimnetz erreichbar und deckt Upload, Daten-CD,
# Audio-CD-Rip und OCR ab.

services:
  # MP3-Sammlungen von Daten-CDs, Audio-CD-Rips, normale Uploads und OCR.
  # Eine Audio-CD ohne Dateisystem kann dieser Weg ebenfalls, weil das Gerät
  # direkt hereingereicht wird.
  mimport-cd:
    build: .

    # Anders als der Upload-Dienst im ganzen Heimnetz erreichbar, damit das
    # Laufwerk vom Sofa aus bedienbar ist.
    #
    # ACHTUNG: mimport hat keine Authentifizierung. Wer im WLAN ist, kann
    # importieren. Von außen darf dieser Port nicht erreichbar sein -- im
    # Router keine Portweiterleitung auf 8001 einrichten.
    ports:
      - "8001:8000"

    volumes:
      - /srv/music:/music
      - /srv/audiobooks:/audiobooks

      # Dieselbe Datenbank wie der Upload-Dienst: eine Library, ein Bestand.
      - mimport-data:/data

      # Eigenes Staging, damit sich die beiden nicht ins Gehege kommen. Der
      # Freiplatz-Schutz greift trotzdem gemeinsam -- er misst das
      # Dateisystem, das sich beide teilen.
      - mimport-cd-staging:/staging

      # Die eingelegte CD. Gemountet wird auf dem HOST, hier kommt nur der
      # fertige Mount read-only herein. Deshalb braucht dieser Container weder
      # /dev/sr0 noch CAP_SYS_ADMIN, das mount() sonst verlangen würde.
      #
      # Auf dem Host je nach Automount-Pfad anpassen, z. B.:
      #   /media/cdrom, /media/<nutzer>/<CD-Name> oder /mnt/cdrom
      - /media/cdrom0:/disc:ro

    # Für Audio-CDs. Die haben kein Dateisystem, ihre Sektoren müssen direkt
    # aus dem Gerät gelesen werden -- ein Mount vom Host hilft hier nicht.
    #
    # Die Gruppen-ID stammt vom Zielrechner (dort 'cdrom:x:24:', /dev/sr0
    # gehört root:cdrom). Auf einem anderen Host neu ermitteln mit
    #   ls -l /dev/sr0 && getent group cdrom
    devices:
      - /dev/sr0:/dev/sr0
    group_add:
      - "24"

    environment:
      MIMPORT_MAX_UPLOAD_BYTES: "6442450944"  # 6 GB
      MIMPORT_MAX_FILES: "500"
      MIMPORT_MIN_FREE_BYTES: "2147483648"
      MIMPORT_MAX_STAGING_BYTES: "21474836480"
      MIMPORT_SESSION_TTL_HOURS: "24"

      # Discogs als zweite, sekundäre Metadatenquelle -- ohne Token bleibt
      # sie schlicht aus (siehe backend/config.py, backend/beets_env.py).
      # Der Token gehört NICHT in diese Datei (sie liegt im Git-Repo),
      # sondern in eine lokale, nicht versionierte '.env' neben dieser Datei
      # -- docker compose liest sie automatisch. Erzeugen unter
      # discogs.com -> Einstellungen -> Entwickler -> "Generate new token".
      MIMPORT_DISCOGS_TOKEN: ${MIMPORT_DISCOGS_TOKEN:-}

      # OCR-Modelle einmalig laden und im Daten-Volume behalten. RapidOCR läuft
      # auf CPU deutlich sparsamer als der Paddle-Stack; die Bildkante wird vor
      # der Inferenz begrenzt, um RAM-Spitzen zu drücken.
      HOME: /data
      MIMPORT_OCR_MODEL_DIR: /data/.rapidocr
      MIMPORT_OCR_ANGLE_CLS: "0"
      MIMPORT_OCR_MAX_IMAGE_SIDE: "1400"
      MIMPORT_OCR_THREADS: "2"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  mimport-data:
  mimport-cd-staging:
