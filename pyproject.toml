[project]
name = "mimport"
version = "0.1.0"
description = "Weboberfläche, um Musik nach Prüfung des Matches über beets zu importieren"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Im Container ist das das beets, mit dem mimport arbeitet: es liefert die
    # Konfiguration fürs Matching und das 'beet' für den Import. Ohne Container
    # muss die Version zum beets im PATH passen -- unterschiedliche Versionen
    # migrieren das Schema der library.db gegeneinander.
    # Das Extra 'lastgenre' zieht pylast nach, ohne das ist das gleichnamige
    # Plugin nicht ladbar. fetchart und embedart brauchen nichts Zusätzliches.
    "beets[lastgenre]>=2.13.1,<3",
    "fastapi[standard]>=0.141.1",
    # Für die DiscID-Abfrage bei MusicBrainz. Kommt ohnehin mit beets, wird
    # hier aber direkt benutzt und deshalb auch direkt genannt.
    "requests>=2.32",
    # OCR für Backcover-Text; verwendet serverseitig das kleine Mobile-Modell.
    "paddleocr>=2.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Für die Prüfung, ob die Oberfläche auf ein schmales Handy passt. Ohne
    # Playwright wird tests/test_mobil.py übersprungen.
    "playwright>=1.49",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: braucht Internet (MusicBrainz). Ausschließen mit -m 'not network'.",
]
