[project]
name = "mimport"
version = "0.1.0"
description = "Weboberfläche, um Musik nach Prüfung des Matches über beets zu importieren"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # An die Version des System-beets anpassen: mimport liest dessen
    # Konfiguration und ruft dessen 'beet' für den Import auf. Unterschiedliche
    # Versionen können das Schema der library.db gegeneinander migrieren.
    "beets>=2.13.1,<3",
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: braucht Internet (MusicBrainz). Ausschließen mit -m 'not network'.",
]
