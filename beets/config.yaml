# beets-Konfiguration für den Container.
#
# Diese Datei ist die einzige beets-Konfiguration im Spiel: mimport liest sie
# fürs Matching, und dasselbe beets importiert damit. Es gibt also keine zweite
# Installation, die abweichen oder die Datenbank anders migrieren könnte.
#
# Wird über BEETSDIR=/config gefunden (siehe Dockerfile).

# Zielverzeichnis der Library. Im Container ein gemountetes Volume -- hier
# landet das fertige Ergebnis, das der Host weiterverwendet.
directory: /music

# Die Datenbank liegt bewusst NICHT unter /music, sondern in einem eigenen
# Volume: sie gehört zum Werkzeug, nicht zur Musiksammlung.
#
# Eine bestehende library.db zieht man um, indem man sie hierher kopiert. beets
# speichert die Pfade importierter Dateien relativ zu 'directory' -- wo das
# Musikverzeichnis liegt, darf sich also ändern. Nur Dateien außerhalb von
# 'directory' stehen mit absolutem Pfad drin; die findet man mit
#   sqlite3 library.db "SELECT path FROM items LIMIT 5;"
# Stehen dort absolute Pfade, hängt man das Musikverzeichnis einfacher unter
# demselben Pfad wie auf dem Host ein, statt die Datenbank umzuschreiben.
library: /data/library.db

# MusicBrainz als Metadatenquelle. Ohne diesen Eintrag gibt es in beets 2.x
# keine Match-Kandidaten -- MusicBrainz ist dort ein Plugin, kein fester
# Bestandteil.
plugins:
  # Ohne dieses Plugin gibt es KEINE Metadatenquelle und damit keinen einzigen
  # Match-Kandidaten -- die Oberfläche bliebe leer. Nicht entfernen.
  - musicbrainz
  # Genres von Last.fm. Braucht pylast, kommt über das Extra 'beets[lastgenre]'
  # aus pyproject.toml.
  - lastgenre
  - fetchart        # Cover holen
  - embedart        # Cover in die Dateien einbetten
  # Weitere sind problemlos ergänzbar, z. B.:
  # - lyrics        # Liedtexte
  # - replaygain    # Lautheit angleichen (braucht ffmpeg im Container)
  # - chroma        # AcoustID-Fingerprints (braucht fpcalc, siehe README)
  #
  # 'discogs' steht bewusst NICHT hier: backend/beets_env.py trägt es zur
  # Laufzeit selbst ein, aber nur wenn MIMPORT_DISCOGS_TOKEN gesetzt ist.
  # Ohne Token fragt das Plugin beim Laden interaktiv nach einem OAuth-Code
  # (beets.ui.input_) -- in einem Prozess ohne Terminal ein Absturz oder ein
  # für immer hängender Request, und das bei jedem Request, nicht nur bei
  # Discogs-Suchen. Aktivieren: auf discogs.com unter Einstellungen ->
  # Entwickler einen persönlichen Zugriffstoken erzeugen und ihn dem
  # Container als MIMPORT_DISCOGS_TOKEN übergeben (z. B. über eine lokale,
  # nicht versionierte .env-Datei neben docker-compose.yml) -- niemals hier
  # eintragen, diese Datei wird ins Image gebacken und liegt im Git-Repo.

# Benennungsschema der Zielstruktur.
paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singletons/$artist - $title
  comp: Compilations/$album%aunique{}/$track $title

import:
  # Verschieben statt kopieren: die Uploads liegen im Staging und sollen dort
  # nicht doppelt Platz belegen.
  move: yes
  copy: no

  # Tags in die Dateien schreiben.
  write: yes

  # Keine Rückfragen im Terminal -- die Entscheidung fällt in der Weboberfläche.
  quiet: yes

  # Bereits importierte Ordner nicht erneut anfassen.
  incremental: no

  # Doppelte Alben nicht stillschweigend überschreiben, sondern überspringen.
  # So kann nie ein bereits vorhandenes Album zerstört werden.
  duplicate_action: skip

  # Bricht ein Import ab, merkt sich beets den Stand und könnte beim nächsten
  # Lauf desselben Pfads dort weitermachen. Bei mimport gibt es nichts
  # fortzusetzen: jeder Import ist ein eigener Staging-Ordner mit zufälligem
  # Namen, der danach verschwindet. ('ask' würde mit -q ohnehin zu 'no'.)
  resume: no

  # 'timid' würde jeden Match einzeln bestätigen lassen. Die Entscheidung ist
  # in der Oberfläche schon gefallen, und ein Subprozess ohne Terminal hätte
  # niemanden zum Fragen.
  timid: no

# Verhindert, dass beets bei fehlenden Feldern nachfragt.
ui:
  color: no

# Vorhandene Tags werden von mimport gesetzt; beets soll beim as-is-Import
# nichts davon verwerfen.
original_date: no
per_disc_numbering: no

# Genres von Last.fm.
#
# Zur Einordnung: das musicbrainz-Plugin liefert von sich aus KEINE Genres
# (dort steht 'genres: False'), lastgenre tritt also nicht gegen MusicBrainz an,
# sondern füllt eine Lücke. Was 'force' zusammen mit 'keep_existing: no' aber
# sehr wohl überschreibt, ist ein Genre, das bereits in der hochgeladenen Datei
# stand -- ein gepflegtes „Post-Rock" wird dann durch die Last.fm-Tags ersetzt.
# So gewollt; wer das nicht will, setzt 'force: no'.
lastgenre:
  auto: yes
  force: yes
  keep_existing: no
  source: album
  count: 4
  canonical: yes

# Cover holen und einbetten.
#
# 'cautious' nimmt nur Bilder, deren Dateiname zu 'cover_names' passt, statt
# irgendein Bild aus dem Ordner. Ohne 'maxwidth' skaliert embedart nicht und
# braucht deshalb kein ImageMagick im Image.
#
# 'fetch_for_asis' ist hier der entscheidende Schalter: mimport importiert
# IMMER mit 'beet import -A' (kein erneutes Tagging, siehe backend/tagging.py)
# -- ohne dieses Flag sucht fetchart bei einem as-is-Import nur lokal (also
# nur ein bereits fotografiertes 'cover.jpg') und nie im Netz, selbst wenn die
# Dateien durch einen übernommenen MusicBrainz-Match längst eine
# Release-ID tragen.
#
# 'sources' bewusst auf die beiden vertrauenswürdigen Quellen eingeschränkt:
# 'filesystem' zuerst (das fotografierte Cover geht immer vor), danach
# 'coverart' (Cover Art Archive, sucht gezielt über die Release-ID). Die
# beets-Standardliste hängt dahinter noch itunes/amazon/albumart an, die ohne
# Release-ID nur über Textsuche raten -- gerade bei Sampler- oder
# Klassik-Compilations ohne MusicBrainz-Match ein Risiko für ein plausibles,
# aber falsches Cover.
fetchart:
  auto: yes
  cautious: true
  cover_names: cover
  fetch_for_asis: yes
  sources:
    - filesystem
    - coverart

# Discogs als zweite, sekundäre Metadatenquelle -- greift nur, wenn
# backend/beets_env.py das Plugin überhaupt aktiviert (siehe der Kommentar
# oben bei 'plugins'). Dieser Block ist trotzdem immer hier, weil der Wert
# kein Geheimnis ist und beim Aktivieren nicht vergessen werden soll.
#
# 'data_source_mismatch_penalty' ist der Abzug, den ein Discogs-Kandidat
# gegenüber einem sonst gleichwertigen MusicBrainz-Kandidaten bekommt --
# 1.0 ist das Maximum, das beets zulässt. MusicBrainz bleibt bewusst
# unangetastet beim eingebauten Standardwert (0.5): ein eigener Wert von 0
# würde MusicBrainz-Treffer künstlich aufwerten, sobald zwei Quellen aktiv
# sind (beets rechnet die Datenquelle dann grundsätzlich mit ein, auch ohne
# Abzug) -- und ein zu Unrecht aufgewerteter Treffer ist die gefährlichere
# Richtung als ein zu vorsichtig eingestufter.
discogs:
  data_source_mismatch_penalty: 1.0
