# mimport als abgeschlossener Dienst.
#
# Nach außen führen nur zwei Dinge: der Port für die Weboberfläche und das
# Musikverzeichnis, in dem das fertige Ergebnis landet.
#
# Zwei Dienste aus demselben Image:
#
#   mimport     Uploads, nur über localhost erreichbar.
#   mimport-cd  Daten-CDs, im Heimnetz erreichbar.
#
# Der Unterschied ist allein die Bindung und das eingehängte CD-Verzeichnis --
# es gibt keinen Schalter für das CD-Feature. Ob unter /disc etwas liegt, ist
# der Schalter. Beide teilen sich die library.db; damit sich zwei gleichzeitige
# Importe nicht in die Quere kommen, serialisiert mimport sie über ein Dateilock
# neben der Datenbank.

services:
  mimport:
    build: .
    # Auf dem Server bewusst nur an localhost binden. Wer die Oberfläche von
    # außen erreichbar machen will, stellt einen Reverse-Proxy mit
    # Authentifizierung davor -- die Anwendung selbst hat keine.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Hier kommt das fertige Ergebnis raus: von beets getaggt, umbenannt und
      # nach dem Schema aus beets/config.yaml einsortiert.
      - /srv/music:/music

      # Hörbücher liegen getrennt von der Musik -- sie gehen nicht durch beets.
      # Von hier liest Audiobookshelf.
      - /srv/audiobooks:/audiobooks

      # Datenbank und Staging bleiben im Container-Umfeld. Named Volumes, damit
      # ein Neustart laufende Uploads nicht verliert.
      - mimport-data:/data
      - mimport-staging:/staging

      # Die beets-Konfiguration liegt im Image. Zum Anpassen ohne Neubau hier
      # einhängen:
      # - ./beets/config.yaml:/config/config.yaml:ro

    environment:
      # Verlustbehaftete Uploads nur bemängeln, nicht ablehnen.
      MIMPORT_MAX_UPLOAD_BYTES: "6442450944"  # 6 GB
      MIMPORT_MAX_FILES: "500"

      # Damit die Anwendung das Dateisystem nicht vollschreiben kann. Staging
      # und Datenbank sind beides Named Volumes und teilen sich die Platte --
      # ein volles Staging träfe also auch die library.db. Auf einem kleinen
      # Server beide Werte nach unten korrigieren.
      MIMPORT_MIN_FREE_BYTES: "2147483648"    # 2 GB Sicherheitsabstand
      MIMPORT_MAX_STAGING_BYTES: "21474836480"  # 20 GB für alle Uploads zusammen
      # Nach dieser Frist gelten nicht importierte Uploads als vergessen.
      MIMPORT_SESSION_TTL_HOURS: "24"

      # AcoustID-Fingerprinting. Braucht zusätzlich das chroma-Plugin in
      # beets/config.yaml sowie fpcalc im Image -- siehe README.
      MIMPORT_FINGERPRINT: "0"

    restart: unless-stopped

    # Abschottung: hochgeladene Dateien werden von Audio-Parsern gelesen, die
    # auf nicht vertrauenswürdigen Bytes arbeiten.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Ein alter Laptop als Server soll nicht durch einen einzelnen Upload
    # lahmgelegt werden.
    deploy:
      resources:
        limits:
          memory: 1g

  # Derselbe Dienst für Daten-CDs -- MP3-Sammlungen, die man nicht rippen muss.
  # Eine Audio-CD ohne Dateisystem kann dieser Weg nicht, die müsste erst
  # gerippt werden.
  mimport-cd:
    build: .

    # Anders als der Upload-Dienst im ganzen Heimnetz erreichbar, damit das
    # Laufwerk vom Sofa aus bedienbar ist.
    #
    # ACHTUNG: mimport hat keine Authentifizierung. Wer im WLAN ist, kann
    # importieren. Von außen darf dieser Port nicht erreichbar sein -- im
    # Router keine Portweiterleitung auf 8001 einrichten.
    ports:
      - "8001:8000"

    volumes:
      - /srv/music:/music
      - /srv/audiobooks:/audiobooks

      # Dieselbe Datenbank wie der Upload-Dienst: eine Library, ein Bestand.
      - mimport-data:/data

      # Eigenes Staging, damit sich die beiden nicht ins Gehege kommen. Der
      # Freiplatz-Schutz greift trotzdem gemeinsam -- er misst das
      # Dateisystem, das sich beide teilen.
      - mimport-cd-staging:/staging

      # Die eingelegte CD. Gemountet wird auf dem HOST, hier kommt nur der
      # fertige Mount read-only herein. Deshalb braucht dieser Container weder
      # /dev/sr0 noch CAP_SYS_ADMIN, das mount() sonst verlangen würde.
      #
      # Auf dem Host je nach Automount-Pfad anpassen, z. B.:
      #   /media/cdrom, /media/<nutzer>/<CD-Name> oder /mnt/cdrom
      - /media/cdrom0:/disc:ro

    # Für Audio-CDs. Die haben kein Dateisystem, ihre Sektoren müssen direkt
    # aus dem Gerät gelesen werden -- ein Mount vom Host hilft hier nicht.
    #
    # Die Gruppen-ID stammt vom Zielrechner (dort 'cdrom:x:24:', /dev/sr0
    # gehört root:cdrom). Auf einem anderen Host neu ermitteln mit
    #   ls -l /dev/sr0 && getent group cdrom
    devices:
      - /dev/sr0:/dev/sr0
    group_add:
      - "24"

    environment:
      MIMPORT_MAX_UPLOAD_BYTES: "6442450944"  # 6 GB
      MIMPORT_MAX_FILES: "500"
      MIMPORT_MIN_FREE_BYTES: "2147483648"
      MIMPORT_MAX_STAGING_BYTES: "21474836480"
      MIMPORT_SESSION_TTL_HOURS: "24"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  mimport-data:
  mimport-staging:
  mimport-cd-staging:
